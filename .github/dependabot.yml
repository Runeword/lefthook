version: 2
updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    # A revision is proposed once it is a week old: long enough for a
    # compromised or broken upstream commit to be noticed and reverted first.
    cooldown:
      default-days: 7
  # ci.yml pins its actions by commit (Runeword/admin requires it); this keeps
  # those pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
