name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The status check branch protection requires (`check = true` in
  # Runeword/admin). Keep the name, and give it no path filter: a required
  # check that a filter skips stays pending, and nothing can merge.
  check:
    runs-on: ubuntu-latest
    # GitHub's default limit is 6 hours. A passing run takes minutes; one still
    # going after 30 is building something no binary cache has.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      # Builds this runner's checks: the committed config against the render,
      # the hooks over every tracked file, and the behaviour tests.
      - run: nix flake check -L --keep-going
      # The step above skips the other systems without failing. Evaluating
      # them all catches an input update that breaks another platform, as
      # nixpkgs dropping x86_64-darwin did in #1. It runs even when the build
      # failed, so one run reports both.
      - if: ${{ !cancelled() }}
        run: nix flake check --no-build --all-systems
